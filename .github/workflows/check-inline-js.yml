name: Adventure script checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  check-inline-javascript:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check inline JavaScript syntax
        run: node scripts/check-inline-js.mjs
