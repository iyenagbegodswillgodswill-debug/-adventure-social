import{createClient}from'https://esm.sh/@supabase/supabase-js@2.57.0';const db=createClient('https://fhjhbkbyglchiiunwohy.supabase.co','sb_publishable_hAnq_0mwuXZowP77K-xluA_yHRhlyhq',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let user=null,rows=[];const copy={follow:'started following you',post_like:'liked one of your posts',post_comment:'commented on one of your posts',direct_message:'sent you a message'};async function load(){const{data,error}=await db.from('member_notifications').select('id,actor_id,kind,entity_id,is_read,created_at,actor:profiles(display_name,username)').order('created_at',{ascending:false}).limit(100);if(error){$('#message').textContent=error.message;$('#items').innerHTML='<div class="empty">Could not load notifications.</div>';return}rows=data||[];$('#items').innerHTML=rows.length?rows.map(n=>{const name=n.actor?.display_name||'An Adventurer';const when=new Date(n.created_at).toLocaleString();const href=n.kind==='direct_message'?'./messages.html':'./index.html?view=feed';return '<article class="item '+(!n.is_read?'unread':'')+'"><div class="avatar">✦</div><div class="body"><p><b>'+esc(name)+'</b> '+copy[n.kind]+'</p><div class="meta">'+esc(when)+(n.is_read?' · Read':' · New')+'</div><a class="link" href="'+href+'" data-open="'+esc(n.id)+'">'+(n.kind==='direct_message'?'Open messages':'Open feed')+'</a></div></article>'}).join(''):'<div class="empty">You are all caught up. When someone follows you, interacts with your posts or messages you, it will appear here.</div>'}$('#items').addEventListener('click',async e=>{const a=e.target.closest('[data-open]');if(!a)return;await db.from('member_notifications').update({is_read:true}).eq('id',a.dataset.open)});$('#markAll').onclick=async()=>{const{error}=await db.from('member_notifications').update({is_read:true}).eq('is_read',false);if(error)$('#message').textContent=error.message;else await load()};const{data}=await db.auth.getSession();user=data.session?.user||null;if(!user){$('#message').textContent='Please sign in to view your private notifications.';$('#items').innerHTML='<div class="empty"><a href="./account.html">Sign in to Adventure</a></div>'}else await load();
