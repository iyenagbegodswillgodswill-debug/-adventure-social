<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#142c45"><title>Notifications | Adventure</title><style>
:root{--navy:#142c45;--gold:#efb94e;--muted:#64748b;--line:#e5eaf0}*{box-sizing:border-box}body{margin:0;background:#f3f6f9;color:#182d3c;font:15px/1.5 system-ui,sans-serif}header{background:linear-gradient(120deg,#142c45,#176c70);color:white;padding:20px max(18px,calc((100% - 800px)/2))}header a{color:white;text-decoration:none;font-weight:750}.brand{font-size:25px;font-weight:900}.brand span{color:var(--gold)}main{max-width:800px;margin:auto;padding:24px 18px 50px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.top h1{margin:0}.btn{border:0;border-radius:10px;padding:10px 13px;background:var(--navy);color:white;font-weight:800;cursor:pointer}.list{display:grid;gap:10px;margin-top:18px}.item{display:flex;gap:13px;align-items:flex-start;padding:15px;background:white;border:1px solid var(--line);border-radius:14px}.item.unread{border-left:4px solid var(--gold);background:#fffdf7}.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#e7f0f2;font-size:20px;flex-shrink:0}.body{flex:1;min-width:0}.body p{margin:2px 0 4px}.meta{color:var(--muted);font-size:11px}.empty{padding:30px;text-align:center;background:white;border:1px dashed #cbd5e1;border-radius:14px;color:var(--muted)}.link{color:#176c70;font-weight:750;text-decoration:none}.error{color:#a33;margin:12px 0}footer{text-align:center;color:var(--muted);font-size:12px;padding:24px}
</style></head><body><header><div class="brand">adventure<span>.</span></div><p>Little moments that keep us connected.</p><nav><a href="./index.html">Home</a>　<a href="./messages.html">Messages</a>　<a href="./marketplace.html">Marketplace</a>　<a href="./account.html">Account</a></nav></header><main><div class="top"><div><h1>Notifications</h1><div class="meta">Your follows, conversations and community activity.</div></div><button class="btn" id="markAll">Mark all read</button></div><div id="message" class="error"></div><div id="items" class="list"><div class="empty">Loading notifications…</div></div></main><footer>Private to your Adventure account.</footer><script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2.57.0';const db=createClient('https://fhjhbkbyglchiiunwohy.supabase.co','sb_publishable_hAnq_0mwuXZowP77K-xluA_yHRhlyhq',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let user=null,rows=[];const copy={follow:'started following you',post_like:'liked one of your posts',post_comment:'commented on one of your posts',direct_message:'sent you a message'};async function load(){const{data,error}=await db.from('member_notifications').select('id,actor_id,kind,entity_id,is_read,created_at,actor:profiles(display_name,username)').order('created_at',{ascending:false}).limit(100);if(error){$('#message').textContent=error.message;$('#items').innerHTML='<div class="empty">Could not load notifications.</div>';return}rows=data||[];$('#items').innerHTML=rows.length?rows.map(n=>{const name=n.actor?.display_name||'An Adventurer';const when=new Date(n.created_at).toLocaleString();const href=n.kind==='direct_message'?'./messages.html':'./index.html?view=feed';return '<article class="item '+(!n.is_read?'unread':'')+'"><div class="avatar">✦</div><div class="body"><p><b>'+esc(name)+'</b> '+copy[n.kind]+'</p><div class="meta">'+esc(when)+(n.is_read?' · Read':' · New')+'</div><a class="link" href="'+href+'" data-open="'+esc(n.id)+'">'+(n.kind==='direct_message'?'Open messages':'Open feed')+'</a></div></article>'}).join(''):'<div class="empty">You're all caught up. When someone follows you, interacts with your posts or messages you, you'll see it here.</div>'}$('#items').addEventListener('click',async e=>{const a=e.target.closest('[data-open]');if(!a)return;await db.from('member_notifications').update({is_read:true}).eq('id',a.dataset.open)});$('#markAll').onclick=async()=>{const{error}=await db.from('member_notifications').update({is_read:true}).eq('is_read',false);if(error)$('#message').textContent=error.message;else await load()};const{data}=await db.auth.getSession();user=data.session?.user||null;if(!user){$('#message').textContent='Please sign in to view your private notifications.';$('#items').innerHTML='<div class="empty"><a href="./account.html">Sign in to Adventure</a></div>'}else await load();
</script></body></html>
